  - id: UZ-TXT-13
    name: Халқаро мега-корпусларнинг ўзбекча қисми (CulturaX, OSCAR, OPUS-100, Belebele)
    group: hf_dataset
    format: Parquet / JSONL
    access: bulk
    origin: registry
    urls:
      - https://huggingface.co/datasets/uonlp/CulturaX
      - https://huggingface.co/datasets/oscar-corpus/OSCAR-2301
      - https://huggingface.co/datasets/oscar-corpus/OSCAR-2201
      - https://huggingface.co/datasets/Helsinki-NLP/opus-100
      - https://huggingface.co/datasets/facebook/belebele
    fetch:
      - {type: hf, repo: uonlp/CulturaX, patterns: ["uz/*"], gated: true}
      - {type: hf, repo: oscar-corpus/OSCAR-2301, patterns: ["*uz_meta*"], gated: true, note: unverified}
      - {type: hf, repo: Helsinki-NLP/opus-100, patterns: ["*en-uz*"]}
      - {type: hf, repo: facebook/belebele, patterns: ["*uzn_Latn*"]}
    note: CulturaX ва OSCAR учун Hugging Face аккаунтида шартларни қабул қилиш ва HF_TOKEN керак.

