# Ўзбек тилидаги матн манбалари каталоги.
#
# origin:
#   registry — «23_til_adabiyotlar_va_matnlar_reestri.txt» реестридан (1-қисм, ўзбек тили).
#   added    — реестрда йўқ, қўшимча топилган манба.
# access:
#   bulk    — scripts/fetch_sources.py бутун манбани (ёки унинг ўзбекча қисмини) юклай олади.
#   direct  — фақат шу ерда кўрсатилган алоҳида файллар (PDF ва ҳ.к.) юкланади.
#   browse  — портал ёки кутубхона; автоматик юклаб олинмайди (муаллифлик ҳуқуқи,
#             сайт шартлари ёки очиқ API йўқлиги сабабли). Қўлда ёки рухсат билан йиғилади.
# fetch:
#   hf   — Hugging Face датасет (patterns: фақат ўзбекча файлларни танлайди).
#   git  — GitHub репозиторийси (--depth 1).
#   url  — тўғридан-тўғри файл ҳаволаси.
#   ia   — Internet Archive элементи (PDF/TXT/DJVU файллари).
# note: «unverified» — ҳавола ёки файл тузилмаси ҳали текширилмаган.

sources:

